name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kopuz-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 \
            --profile minimal \
            --component rustfmt \
            --target wasm32-unknown-unknown
          rustup default 1.96.0

      - name: Cache Cargo files
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/cargo-leptos
            target/
          key: ${{ runner.os }}-cargo-cl0.3.6-wb0.2.127-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cl0.3.6-wb0.2.127-

      - name: Install Leptos build tools
        run: |
          cargo_leptos_version="$(cargo leptos --version 2>/dev/null || true)"
          if [[ "$cargo_leptos_version" != 'cargo-leptos 0.3.6' ]]; then
            cargo install --version 0.3.6 --locked --force cargo-leptos
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test server build
        run: cargo test --locked --all-targets --features ssr

      - name: Build production bundle
        run: |
          cargo leptos build --release \
            --lib-cargo-args='--locked' \
            --bin-cargo-args='--locked'

  deploy:
    name: Deploy to homeserver
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEPLOY_SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in DEPLOY_HOST TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET DEPLOY_SSH_PRIVATE_KEY_B64 DEPLOY_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub variable or secret ${name} is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null

      - name: Synchronize source
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          remote="temidaradev@${DEPLOY_HOST}"
          ssh_args=(
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )

          ssh "${ssh_args[@]}" "$remote" \
            'install -d -m 0755 /home/temidaradev/Projects/kopuz-website/source'

          rsync -rlptDz --delete \
            --exclude '/.git/' \
            --exclude '/target/' \
            --exclude '/kopuz-website.env' \
            --exclude '/sponsors_state.json' \
            -e "ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./ "$remote:/home/temidaradev/Projects/kopuz-website/source/"

      - name: Build and activate release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          remote="temidaradev@${DEPLOY_HOST}"
          ssh_args=(
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )

          # GITHUB_SHA is intentionally expanded on the runner and validated remotely.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$remote" \
            "DEPLOY_ROOT=/home/temidaradev/Projects/kopuz-website DEPLOY_HEALTHCHECK_URL=http://127.0.0.1:8090/ DEPLOY_RELEASES_TO_KEEP=5 bash /home/temidaradev/Projects/kopuz-website/source/scripts/deploy-remote.sh '${GITHUB_SHA}'"
